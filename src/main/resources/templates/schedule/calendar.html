<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Календар тренера</title>
    <link rel="stylesheet" th:href="@{/css/calendar.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div th:replace="~{fragment/topbar :: topbar}"></div>

<main class="calendar-wrapper calendar-page">

  <h2 class="calendar-title">Розклад тренера</h2>

  <div class="calendar-grid">

      <div class="day-column" th:each="entry : ${week.sessionsByDay}">
          <div class="day-title" th:text="${entry.key}">Monday</div>

          <div class="day-body">
              <div class="session-block"
                   th:each="s : ${entry.value}"
                   th:style="'top:' + ${(s.date.hour - 8) * 60 + s.date.minute} + 'px;'">
                  <b th:text="${s.name}"></b>
                  <span th:text="${#temporals.format(s.date,'HH:mm')}"></span>
              </div>
          </div>
      </div>

  </div>

</main>

</body>
</html>
