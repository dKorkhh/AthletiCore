<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Керування тренуваннями</title>

  <link rel="stylesheet" th:href="@{/css/session-admin.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
  <link rel="stylesheet" th:href="@{/css/admin-users.css}">
</head>
<body>

<div th:replace="~{fragment/topbar :: topbar}"></div>

<main class="session-admin-container">

  <div class="session-admin-header">
    <h2>Усі тренування</h2>
    <a class="session-admin-add-btn" th:href="@{/api/sessions/add}">
      + Додати тренування
    </a>
  </div>

  <table class="session-admin-table">
    <thead>
    <tr>
      <th>Назва</th>
      <th>Дата</th>
      <th>Тренер</th>
      <th>Місця</th>
      <th>Дії</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="s : ${trainingSessions}">
      <td th:text="${s.name}"></td>
      <td th:text="${#temporals.format(s.date, 'dd.MM.yyyy HH:mm')}"></td>
      <td th:text="${s.trainer.fullName}"></td>
      <td th:text="${s.maxParticipants}"></td>

      <td class="session-admin-actions">
        <a th:href="@{/api/sessions/edit/{id}(id=${s.id})}" class="session-admin-edit">
          Редагувати
        </a>

        <form th:action="@{/api/sessions/{id}(id=${s.id})}"
              method="post"
              onsubmit="return confirm('Ви впевнені, що хочете видалити?')">
          <input type="hidden" name="_method" value="delete"/>
          <button type="submit" class="session-admin-delete">
            Видалити
          </button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <div th:replace="fragment/pagination :: paginator(page=${page})"></div>

</main>
</body>
</html>
