<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Athleticore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/sessions.css}">
    <link rel="stylesheet" th:href="@{/css/admin-users.css}">
</head>
<body>
    <div th:replace="~{fragment/topbar :: topbar}"></div>

    <main class="sessions-page">

        <div class="session-header">
            <h2>Тренування</h2>
        </div>

        <div class="sessions-grid">
            <div class="session-card"
                 th:each="s : ${trainingSessions}"
                 th:onclick="|window.location.href='/api/booking/${s.id}'|">

                <div class="difficulty-tag" th:text="${s.difficulty}"></div>

                <h3 class="session-title" th:text="${s.name}"></h3>

                <p class="session-desc" th:text="${s.description}"></p>

                <div class="session-info-vertical">

                    <div class="line">
                        <span class="label">Дата:</span>
                        <span th:text="${#temporals.format(s.date,'dd.MM.yyyy HH:mm')}"></span>
                    </div>

                    <div class="line">
                        <span class="label">Тривалість:</span>
                        <span th:text="${s.duration}"></span> хв
                    </div>

                    <div class="line">
                        <span class="label">Категорія:</span>
                        <span th:text="${s.category}"></span>
                    </div>

                    <div class="line">
                        <span class="label">Тренер:</span>
                        <span th:text="${s.trainer.fullName}"></span>
                    </div>

                </div>

                <div class="participants">
                    <span th:text="${s.bookings.size()}"></span> /
                    <span th:text="${s.maxParticipants}"></span>
                </div>

            </div>
        </div>

        <div th:replace="fragment/pagination :: paginator(page=${page})"></div>

    </main>

</body>
</html>
