<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Створення тренування</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragment/topbar :: topbar}"></div>

<main class="form-wrapper">

    <h2 class="form-title">Створити тренування</h2>

    <form th:action="@{/api/sessions/add}" th:object="${sessionDto}" method="post" class="session-form">
        <label>Назва тренування</label>
        <input type="text" th:field="*{name}" placeholder="Наприклад: Cardio Mix" required>
        <div class="error" th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}"></div>

        <label>Опис</label>
        <textarea th:field="*{description}" required placeholder="Короткий опис тренування (необов'язково)"></textarea>

        <label>Тип тренування</label>
        <select th:field="*{sessionType}" required>
            <option th:each="t : ${sessionTypes}"
                    th:value="${t}"
                    th:text="${t}"></option>
        </select>

        <input type="datetime-local" value="???" hidden="hidden">

        <label>Дата та час</label>
        <input type="datetime-local"
               name="date"
               th:value="${#temporals.format(sessionDto.date, 'yyyy-MM-dd''T''HH:mm')}"
               required>
        <div class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>

        <label class="checkbox-label">
            <input type="hidden" name="repeat" value="false"/>
            <input type="checkbox" th:field="*{repeat}">
            Повторювати щотижня
        </label>

        <label>Тривалість (хвилини)</label>
        <input type="number" th:field="*{duration}" min="5" placeholder="Напр: 60" required>

        <label>Тренер</label>
        <select th:field="*{trainerId}" required>
            <option th:each="u : ${trainers}"
                    th:value="${u.id}"
                    th:text="${u.fullName}"></option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('trainerId')}" th:errors="*{trainerId}"></div>

        <label>Категорія</label>
        <select th:field="*{category}" required>
            <option th:each="c : ${categories}"
                    th:value="${c}"
                    th:text="${c}"></option>
        </select>

        <label>Складність</label>
        <select th:field="*{difficulty}" required>
            <option th:each="d : ${difficulties}"
                    th:value="${d}"
                    th:text="${d}"></option>
        </select>

        <label>Макс. кількість учасників</label>
        <input type="number" th:field="*{maxParticipants}" min="1" placeholder="Напр: 12" required>

        <button type="submit" class="primary-btn">Створити</button>

    </form>

    <div th:if="${errorMessage}" class="error-banner">
        <p th:text="${errorMessage}"></p>
    </div>
</main>
</body>
</html>
